plugins {
    // Android application 插件：让这个模块成为可以安装到手机上的 APK。
    id 'com.android.application'

    // Kotlin Android 插件：让 app 模块可以编译 Android/Kotlin 代码。
    id 'org.jetbrains.kotlin.android'

    // kapt 是 Kotlin 的注解处理工具，Hilt 需要它生成依赖注入代码。
    id 'org.jetbrains.kotlin.kapt'

    // Hilt 插件：简化 Android 里的依赖注入配置。
    id 'com.google.dagger.hilt.android'
}

android {
    // namespace 是 R、BuildConfig、ViewBinding 等生成类所属的包名。
    namespace 'com.maimai.android'

    // compileSdk 表示用 Android 34 的 API 编译。这里对应 Android 14。
    compileSdk 34

    defaultConfig {
        // applicationId 是安装到手机后的唯一应用 ID。
        applicationId 'com.maimai.android'

        // minSdk 是最低支持的 Android 版本。
        minSdk 26

        // targetSdk 表示 App 按 Android 14 的行为规则适配。
        targetSdk 34

        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        // BuildConfig.DEBUG 等生成字段。
        buildConfig true

        // ViewBinding 让 Kotlin 可以通过 binding.xxx 访问 XML 控件。
        viewBinding true

        // DataBinding 让 XML 可以使用 @{...} 表达式绑定 ViewModel/state。
        dataBinding true
    }

    compileOptions {
        // Java 编译目标。需要和 Kotlin jvmTarget 保持一致。
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    // 指定 Kotlin 使用 JDK 17 工具链，避免 IDE/JDK 版本不同导致 target 不一致。
    jvmToolchain(17)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        // Kotlin 字节码目标也固定为 JVM 17，和上面的 Java 17 对齐。
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

kapt {
    // Hilt 生成代码时，有些类型会先由别的处理器生成；这个开关能减少误报。
    correctErrorTypes true
}

dependencies {
    // 依赖根模块里的 maimai Kotlin 客户端库。
    implementation project(':')

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'com.google.dagger:hilt-android:2.51'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    kapt 'com.google.dagger:hilt-android-compiler:2.51'
}
